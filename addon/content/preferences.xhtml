<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  </linkset>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

    <checkbox
      id="zotero-prefpane-__addonRef__-hide-automatic-tags"
      preference="extensions.zotero.__addonRef__.hideAutomaticTags"
      data-l10n-id="pref-hide-automatic-tags"
      style="margin-top: 10px"
    />

    <checkbox
      id="zotero-prefpane-__addonRef__-zettlr-citation-format"
      preference="extensions.zotero.__addonRef__.zettlrCitationFormat"
      data-l10n-id="pref-zettlr-citation-format"
      style="margin-top: 8px"
    />

    <hbox align="center" style="margin-top: 12px; gap: 10px">
      <html:label
        for="zotero-prefpane-__addonRef__-double-click"
        data-l10n-id="pref-double-click-label"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-double-click"
        preference="extensions.zotero.__addonRef__.doubleClickAction"
      >
        <menupopup>
          <menuitem
            value="openAttachment"
            data-l10n-id="pref-double-click-open-attachment"
          />
          <menuitem
            value="selectInZotero"
            data-l10n-id="pref-double-click-select-zotero"
          />
          <menuitem value="none" data-l10n-id="pref-double-click-none" />
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="margin-top: 10px; gap: 10px">
      <html:label
        for="zotero-prefpane-__addonRef__-density"
        data-l10n-id="pref-density-label"
      ></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-density"
        preference="extensions.zotero.__addonRef__.density"
      >
        <menupopup>
          <menuitem
            value="comfortable"
            data-l10n-id="pref-density-comfortable"
          />
          <menuitem value="compact" data-l10n-id="pref-density-compact" />
        </menupopup>
      </menulist>
    </hbox>

    <html:p
      data-l10n-id="pref-launcher-endpoint"
      style="
        margin: 14px 0 0;
        color: var(--fill-secondary, #666);
        font-size: 0.9em;
      "
    ></html:p>
  </groupbox>

  <vbox
    style="
      margin-top: 20px;
      border-top: 1px solid var(--stroke-divider, #ccc);
      padding-top: 10px;
    "
  >
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
      style="color: var(--fill-secondary, #666); font-size: 0.85em"
    ></html:label>
  </vbox>
</vbox>
